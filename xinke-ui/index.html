<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="icon" type="image/png" href="/src/assets/logo/logo.png">
  <title>%VITE_APP_TITLE%</title>
  <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8;
    }

    .chromeframe {
      margin: 0.2em 0;
      background: #ccc;
      color: #000;
      padding: 0.2em 0;
    }

    #loader-wrapper {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6f8;
    }

    .boot-card {
      position: relative;
      z-index: 1;
      width: min(320px, calc(100vw - 48px));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: 7vh;
    }

    .loader-mark {
      position: relative;
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      margin-bottom: 18px;
    }

    .loader-mark::before,
    .loader-mark::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 3px solid #e1e5ea;
      border-radius: 50%;
    }

    .loader-mark::after {
      border-color: #f26b21 transparent transparent;
      animation: loader-spin .85s linear infinite;
    }

    .load-logo {
      width: 34px;
      height: 34px;
      object-fit: contain;
      animation: logo-pulse 1.6s ease-in-out infinite;
    }

    .load-title {
      margin: 0;
      color: #172033;
      font-size: 20px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .load-subtitle {
      margin: 7px 0 0;
      color: #7b8592;
      font-size: 12px;
    }

    .loading-dots {
      height: 6px;
      display: flex;
      gap: 5px;
      margin-top: 18px;
    }

    .loading-dots span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #f26b21;
      animation: dot-bounce 1.1s ease-in-out infinite;
    }

    .loading-dots span:nth-child(2) {
      animation-delay: .14s;
    }

    .loading-dots span:nth-child(3) {
      animation-delay: .28s;
    }

    @keyframes loader-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes logo-pulse {

      0%,
      100% {
        transform: scale(.94);
        opacity: .78;
      }

      50% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes dot-bounce {

      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: .35;
      }

      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .loader-mark::after,
      .load-logo,
      .loading-dots span {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="loader-wrapper">
      <div class="boot-card">
        <div class="loader-mark" aria-hidden="true">
          <!-- <img class="load-logo" src="/src/assets/logo/logo.png" alt=""> -->
        </div>
        <p class="load-title">Xinke ERP</p>
        <p class="load-subtitle">正在加载...</p>
        <div class="loading-dots" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
