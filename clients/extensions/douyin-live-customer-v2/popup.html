<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>直播客户采集器</title><link rel="stylesheet" href="popup.css"></head><body><main><header><div class="brand"><span class="logo">播</span><div><strong>直播客户采集器</strong><small>现场助手 · V2</small></div></div><span id="status-dot" class="dot"></span></header><section class="room-card"><span class="eyebrow">当前直播间</span><strong id="room">正在读取直播间...</strong></section><section class="status-line"><span>采集状态</span><b id="status">检查中</b></section><div class="metrics"><div><strong id="comments">0</strong><span>评论用户</span></div><div><strong id="viewers">0</strong><span>观看用户</span></div><div><strong id="pending">0</strong><span>待同步</span></div></div><button id="toggle" class="primary">开始采集</button><div class="button-row"><button id="upload" class="secondary">立即同步</button><button id="debug" class="secondary">查看采集</button><button id="open" class="secondary">客户中心</button></div><button id="update" class="update" hidden>下载新版</button><p id="message"></p><footer>数据会先保存在本机，网络恢复后自动同步</footer></main><script src="popup.js"></script></body></html>
